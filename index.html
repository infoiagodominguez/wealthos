<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WealthOS</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;700&family=Unbounded:wght@300;400;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080810;
  --s1: #0d0d1a;
  --s2: #12121f;
  --border: #1c1c30;
  --border2: #252540;
  --text: #ddddf5;
  --muted: #44445a;
  --muted2: #666680;

  --banks: #22d3a5;
  --funds: #3b82f6;
  --stocks: #a855f7;
  --crypto: #f59e0b;
  --nft: #ec4899;
  --car: #64748b;
  --estate: #10b981;
  --pension: #f97316;
  --betoven: #e11d48;

  --mono: 'IBM Plex Mono', monospace;
  --display: 'Unbounded', sans-serif;
}

html, body { height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--mono);
  display: flex;
  flex-direction: column;
  position: relative;
}

/* GRID BACKGROUND */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(34,211,165,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,165,0.02) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
  z-index: 0;
}

/* HEADER */
.header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  flex-shrink: 0;
}

.logo {
  font-family: var(--display);
  font-size: 11px;
  font-weight: 900;
  letter-spacing: 4px;
  color: var(--banks);
  text-transform: uppercase;
}

.header-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 1px;
}

.header-date {
  font-size: 9px;
  color: var(--muted2);
  letter-spacing: 1px;
}

/* TOTAL BAR */
.total-bar {
  position: relative;
  z-index: 10;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  background: var(--s1);
  flex-shrink: 0;
}

.total-label {
  font-size: 9px;
  color: var(--muted2);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.total-num {
  font-family: var(--display);
  font-size: 28px;
  font-weight: 700;
  color: var(--banks);
  line-height: 1;
  letter-spacing: -1px;
}

.total-eur {
  font-size: 12px;
  color: var(--muted2);
  margin-left: 4px;
  font-family: var(--mono);
}

.segment-bar {
  display: flex;
  height: 3px;
  border-radius: 2px;
  overflow: hidden;
  margin-top: 12px;
  background: var(--border);
  gap: 1px;
}

.seg { height: 100%; transition: width 0.5s ease; border-radius: 1px; }

.mini-totals {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin-top: 10px;
}

.mini-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 9px;
  color: var(--muted2);
}

.mini-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.mini-val { color: var(--text); font-size: 10px; }

/* SCROLL AREA */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  position: relative;
  z-index: 10;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 70px;
}

.scroll-area::-webkit-scrollbar { width: 2px; }
.scroll-area::-webkit-scrollbar-track { background: transparent; }
.scroll-area::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 1px; }

/* SECTION */
.section { border-bottom: 1px solid var(--border); }

.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px 10px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}

.section-head:hover { background: rgba(255,255,255,0.02); }

.section-head-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-pip {
  width: 3px;
  height: 14px;
  border-radius: 2px;
  flex-shrink: 0;
}

.section-name {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted2);
  font-family: var(--display);
  font-weight: 400;
}

.section-total {
  font-size: 11px;
  color: var(--text);
}

.section-chevron {
  font-size: 10px;
  color: var(--muted);
  transition: transform 0.2s;
  margin-left: 8px;
}

.section-chevron.open { transform: rotate(180deg); }

/* SECTION BODY */
.section-body {
  display: none;
  padding: 0 16px 12px;
}

.section-body.open { display: block; }

/* ROWS */
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 0;
  border-top: 1px solid var(--border);
  gap: 8px;
}

.row:first-child { border-top: none; }

.row-left { flex: 1; min-width: 0; }

.row-name {
  font-size: 11px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.row-sub {
  font-size: 9px;
  color: var(--muted2);
  margin-top: 1px;
}

.row-right {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* EDITABLE INPUT */
.amt-input {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 3px 6px;
  text-align: right;
  width: 110px;
  transition: all 0.15s;
  -webkit-appearance: none;
  cursor: pointer;
}

.amt-input:hover {
  border-color: var(--border2);
  background: rgba(255,255,255,0.02);
}

.amt-input:focus {
  outline: none;
  background: rgba(255,255,255,0.04);
  cursor: text;
}

/* DELETE BTN */
.del-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 14px;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 3px;
  transition: color 0.15s;
  line-height: 1;
}

.del-btn:hover { color: #ef4444; }

/* ADD ROW */
.add-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 0 2px;
  border-top: 1px solid var(--border);
  cursor: pointer;
  color: var(--muted2);
  font-size: 9px;
  letter-spacing: 1px;
  background: none;
  border-left: none;
  border-right: none;
  border-bottom: none;
  width: 100%;
  text-align: left;
  transition: color 0.15s;
}

.add-row:hover { color: var(--text); }
.add-row-icon { font-size: 12px; }

/* BOTTOM NAV */
.bottom-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 50;
  display: flex;
  background: var(--bg);
  border-top: 1px solid var(--border);
  padding: 10px 0 14px;
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
  transition: color 0.15s;
  padding: 0;
}

.nav-btn.active { color: var(--banks); }
.nav-btn:hover { color: var(--muted2); }
.nav-icon { font-size: 17px; line-height: 1; }

/* PAGES */
.page { display: none; }
.page.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }

/* CHART PAGE */
.chart-page-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  padding-bottom: 70px;
}

.chart-card {
  background: var(--s1);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  margin-bottom: 12px;
}

.chart-card-title {
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted2);
  margin-bottom: 14px;
}

canvas { display: block; width: 100% !important; }

/* DIST PAGE */
.dist-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
}

.dist-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.dist-label {
  font-size: 10px;
  color: var(--muted2);
  width: 80px;
  flex-shrink: 0;
}

.dist-bar-wrap {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}

.dist-bar-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.5s ease;
}

.dist-pct {
  font-size: 10px;
  color: var(--text);
  width: 36px;
  text-align: right;
  flex-shrink: 0;
}

/* TOAST */
.toast {
  position: fixed;
  bottom: 74px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--s2);
  border: 1px solid var(--banks);
  color: var(--banks);
  font-family: var(--mono);
  font-size: 10px;
  padding: 6px 14px;
  border-radius: 4px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s;
  z-index: 999;
  white-space: nowrap;
}

.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="toast" id="toast">✓ guardado</div>

<!-- PAGE HOME -->
<div class="page active" id="page-home">
  <div class="header">
    <div class="logo">WealthOS</div>
    <div class="header-right">
      <div class="header-date" id="hDate"></div>
    </div>
  </div>

  <div class="total-bar">
    <div class="total-label">patrimonio neto total</div>
    <div>
      <span class="total-num" id="totalNum">0,00</span>
      <span class="total-eur">EUR</span>
    </div>
    <div class="segment-bar" id="segBar"></div>
    <div class="mini-totals" id="miniTotals"></div>
  </div>

  <div class="scroll-area" id="homeScroll">
    <!-- sections injected by JS -->
  </div>
</div>

<!-- PAGE CHARTS -->
<div class="page" id="page-charts">
  <div class="header">
    <div class="logo">Historial</div>
    <div class="header-date" id="hDate2"></div>
  </div>
  <div class="chart-page-scroll">
    <div class="chart-card">
      <div class="chart-card-title">evolución patrimonio</div>
      <canvas id="lineChart" height="160"></canvas>
    </div>
    <div class="chart-card" id="distCard">
      <div class="chart-card-title">distribución por categoría</div>
      <div class="dist-grid" id="distGrid"></div>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-btn active" id="nav-home" onclick="goPage('home')">
    <span class="nav-icon">⬡</span>INICIO
  </button>
  <button class="nav-btn" id="nav-charts" onclick="goPage('charts')">
    <span class="nav-icon">◎</span>ANÁLISIS
  </button>
</div>

<script>
// ─── CONFIG ─────────────────────────────────────────────────────────────
const SECTIONS = [
  { id: 'banks',   label: 'Cuentas Bancarias', color: '#22d3a5', items: [
    { id: 'abanca',      name: 'Abanca',      sub: 'cuenta corriente' },
    { id: 'revolut',     name: 'Revolut',     sub: 'cuenta digital' },
    { id: 'myinvestor',  name: 'MyInvestor',  sub: 'cuenta ahorro' },
  ]},
  { id: 'funds',   label: 'Fondos de Inversión', color: '#3b82f6', items: [] },
  { id: 'stocks',  label: 'Acciones / ETF',       color: '#a855f7', items: [] },
  { id: 'crypto',  label: 'Criptomonedas',         color: '#f59e0b', items: [] },
  { id: 'nft',     label: 'NFTs',                  color: '#ec4899', items: [] },
  { id: 'car',     label: 'Vehículos',             color: '#64748b', items: [] },
  { id: 'estate',  label: 'Bienes Inmuebles',      color: '#10b981', items: [] },
  { id: 'pension', label: 'Plan de Pensiones',     color: '#f97316', items: [] },
  { id: 'betoven', label: 'Betoven',               color: '#e11d48', items: [] },
];

// ─── STATE ──────────────────────────────────────────────────────────────
function defaultData() {
  const d = {};
  SECTIONS.forEach(s => {
    d[s.id] = s.items.map(it => ({ ...it, amount: 0 }));
  });
  d.history = [];
  d.open = {};
  SECTIONS.forEach(s => d.open[s.id] = s.id === 'banks');
  return d;
}

function load() {
  try {
    const raw = localStorage.getItem('wos2');
    if (!raw) return defaultData();
    const saved = JSON.parse(raw);
    // Merge: keep default bank items if missing
    const def = defaultData();
    SECTIONS.forEach(s => {
      if (!saved[s.id]) saved[s.id] = def[s.id];
    });
    if (!saved.history) saved.history = [];
    if (!saved.open) saved.open = def.open;
    return saved;
  } catch { return defaultData(); }
}

function save() {
  localStorage.setItem('wos2', JSON.stringify(D));
}

let D = load();

// ─── UTILS ──────────────────────────────────────────────────────────────
const fmt = n => new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n || 0);
const parseAmt = s => parseFloat((s || '0').replace(/\./g, '').replace(',', '.')) || 0;

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg || '✓ guardado';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1600);
}

function sectionTotal(id) {
  return (D[id] || []).reduce((s, x) => s + (x.amount || 0), 0);
}

function grandTotal() {
  return SECTIONS.reduce((s, sec) => s + sectionTotal(sec.id), 0);
}

// ─── RENDER SECTIONS ────────────────────────────────────────────────────
function renderHome() {
  const container = document.getElementById('homeScroll');
  container.innerHTML = '';

  SECTIONS.forEach((sec, si) => {
    const secEl = document.createElement('div');
    secEl.className = 'section';
    secEl.id = 'sec-' + sec.id;

    const isOpen = D.open[sec.id];
    const total = sectionTotal(sec.id);

    secEl.innerHTML = `
      <div class="section-head" onclick="toggleSection('${sec.id}')">
        <div class="section-head-left">
          <div class="section-pip" style="background:${sec.color}"></div>
          <div class="section-name">${sec.label}</div>
        </div>
        <div style="display:flex;align-items:center">
          <div class="section-total">${fmt(total)} €</div>
          <div class="section-chevron ${isOpen ? 'open' : ''}">▼</div>
        </div>
      </div>
      <div class="section-body ${isOpen ? 'open' : ''}" id="body-${sec.id}">
        ${renderRows(sec)}
        <button class="add-row" onclick="addItem('${sec.id}')">
          <span class="add-row-icon">+</span> añadir elemento
        </button>
      </div>
    `;

    // Attach input handlers after insert
    container.appendChild(secEl);
    attachInputs(sec.id);
  });

  updateTotals();
}

function renderRows(sec) {
  const items = D[sec.id] || [];
  if (items.length === 0) return '';
  return items.map((item, i) => `
    <div class="row" id="row-${sec.id}-${i}">
      <div class="row-left">
        <div class="row-name">${item.name}</div>
        ${item.sub ? `<div class="row-sub">${item.sub}</div>` : ''}
      </div>
      <div class="row-right">
        <input
          type="text"
          inputmode="decimal"
          class="amt-input"
          data-sec="${sec.id}"
          data-idx="${i}"
          value="${fmt(item.amount)}"
          style="border-color: transparent"
          onfocus="this.select()"
        >
        <button class="del-btn" onclick="delItem('${sec.id}',${i})" title="eliminar">×</button>
      </div>
    </div>
  `).join('');
}

function attachInputs(secId) {
  const body = document.getElementById('body-' + secId);
  if (!body) return;
  body.querySelectorAll('.amt-input').forEach(inp => {
    inp.addEventListener('focus', () => {
      const idx = +inp.dataset.idx;
      inp.value = (D[secId][idx].amount || 0).toFixed(2).replace('.', ',');
    });
    inp.addEventListener('blur', () => {
      const idx = +inp.dataset.idx;
      const val = parseAmt(inp.value);
      D[secId][idx].amount = val;
      inp.value = fmt(val);
      save();
      updateTotals();
      saveHistory();
      toast('✓ guardado');
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') inp.blur();
      if (e.key === 'Escape') {
        const idx = +inp.dataset.idx;
        inp.value = fmt(D[secId][idx].amount);
        inp.blur();
      }
    });
    // Style on focus
    inp.addEventListener('focus', () => {
      const sec = SECTIONS.find(s => s.id === inp.dataset.sec);
      inp.style.borderColor = sec ? sec.color : '#22d3a5';
      inp.style.background = 'rgba(255,255,255,0.04)';
    });
    inp.addEventListener('blur', () => {
      inp.style.borderColor = 'transparent';
      inp.style.background = 'transparent';
    });
  });
}

// ─── SECTION TOGGLE ─────────────────────────────────────────────────────
function toggleSection(id) {
  D.open[id] = !D.open[id];
  save();
  const body = document.getElementById('body-' + id);
  const chevron = document.querySelector(`#sec-${id} .section-chevron`);
  if (D.open[id]) {
    body.classList.add('open');
    chevron?.classList.add('open');
  } else {
    body.classList.remove('open');
    chevron?.classList.remove('open');
  }
}

// ─── ADD / DELETE ────────────────────────────────────────────────────────
function addItem(secId) {
  const name = prompt('Nombre:');
  if (!name?.trim()) return;
  const sub = prompt('Subtítulo (opcional):') || '';
  D[secId].push({ id: secId + '_' + Date.now(), name: name.trim(), sub: sub.trim(), amount: 0 });
  D.open[secId] = true;
  save();
  renderHome();
}

function delItem(secId, idx) {
  if (!confirm(`¿Eliminar "${D[secId][idx].name}"?`)) return;
  D[secId].splice(idx, 1);
  save();
  renderHome();
  toast('eliminado');
}

// ─── TOTALS ──────────────────────────────────────────────────────────────
function updateTotals() {
  const gt = grandTotal();
  document.getElementById('totalNum').textContent = fmt(gt);

  // Update section totals
  SECTIONS.forEach(sec => {
    const el = document.querySelector(`#sec-${sec.id} .section-total`);
    if (el) el.textContent = fmt(sectionTotal(sec.id)) + ' €';
  });

  // Segment bar
  const bar = document.getElementById('segBar');
  if (gt === 0) {
    bar.innerHTML = '<div class="seg" style="width:100%;background:#1c1c30"></div>';
  } else {
    bar.innerHTML = SECTIONS.map(s => {
      const pct = (sectionTotal(s.id) / gt * 100).toFixed(2);
      return `<div class="seg" style="width:${pct}%;background:${s.color}"></div>`;
    }).join('');
  }

  // Mini totals
  const mini = document.getElementById('miniTotals');
  mini.innerHTML = SECTIONS.filter(s => sectionTotal(s.id) > 0).map(s => `
    <div class="mini-item">
      <div class="mini-dot" style="background:${s.color}"></div>
      <span>${s.label.split(' ')[0]}</span>
      <span class="mini-val">${fmt(sectionTotal(s.id))} €</span>
    </div>
  `).join('');
}

// ─── HISTORY ─────────────────────────────────────────────────────────────
function saveHistory() {
  const now = new Date();
  const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
  const label = now.toLocaleDateString('es-ES', { month: 'short', year: '2-digit' }).toUpperCase();
  const total = grandTotal();
  const idx = D.history.findIndex(h => h.key === key);
  if (idx >= 0) D.history[idx] = { key, label, total };
  else D.history.push({ key, label, total });
  if (D.history.length > 24) D.history = D.history.slice(-24);
  save();
}

// ─── CHARTS PAGE ─────────────────────────────────────────────────────────
function renderCharts() {
  renderLineChart();
  renderDistGrid();
}

function renderLineChart() {
  const canvas = document.getElementById('lineChart');
  const ctx = canvas.getContext('2d');
  const W = canvas.offsetWidth || 300;
  const H = 160;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  ctx.clearRect(0, 0, W, H);

  const hist = D.history;
  if (hist.length < 2) {
    ctx.fillStyle = '#44445a';
    ctx.font = '10px IBM Plex Mono, monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Actualiza importes cada mes para ver la evolución', W/2, H/2);
    return;
  }

  const vals = hist.map(h => h.total);
  const labels = hist.map(h => h.label);
  const pad = { t: 12, r: 12, b: 24, l: 12 };
  const iW = W - pad.l - pad.r;
  const iH = H - pad.t - pad.b;
  const mn = Math.min(...vals) * 0.95;
  const mx = Math.max(...vals) * 1.05 || 1;

  const x = i => pad.l + (i / (vals.length - 1)) * iW;
  const y = v => pad.t + iH - ((v - mn) / (mx - mn)) * iH;

  // Grid
  for (let i = 0; i <= 3; i++) {
    const gy = pad.t + (iH / 3) * i;
    ctx.beginPath(); ctx.moveTo(pad.l, gy); ctx.lineTo(W - pad.r, gy);
    ctx.strokeStyle = '#1c1c30'; ctx.lineWidth = 1; ctx.stroke();
  }

  const pts = vals.map((v, i) => ({ x: x(i), y: y(v) }));

  // Fill
  const grad = ctx.createLinearGradient(0, pad.t, 0, H - pad.b);
  grad.addColorStop(0, '#22d3a550');
  grad.addColorStop(1, '#22d3a500');
  ctx.beginPath();
  ctx.moveTo(pts[0].x, H - pad.b);
  pts.forEach(p => ctx.lineTo(p.x, p.y));
  ctx.lineTo(pts[pts.length-1].x, H - pad.b);
  ctx.closePath(); ctx.fillStyle = grad; ctx.fill();

  // Line
  ctx.beginPath();
  pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
  ctx.strokeStyle = '#22d3a5'; ctx.lineWidth = 1.5;
  ctx.lineJoin = 'round'; ctx.stroke();

  // Dots
  pts.forEach(p => {
    ctx.beginPath(); ctx.arc(p.x, p.y, 2.5, 0, Math.PI*2);
    ctx.fillStyle = '#22d3a5'; ctx.fill();
  });

  // Labels
  ctx.fillStyle = '#44445a'; ctx.font = '8px IBM Plex Mono, monospace';
  ctx.textAlign = 'center';
  const step = Math.max(1, Math.ceil(labels.length / 5));
  labels.forEach((l, i) => {
    if (i % step === 0 || i === labels.length - 1)
      ctx.fillText(l, pts[i].x, H - 6);
  });
}

function renderDistGrid() {
  const gt = grandTotal();
  const grid = document.getElementById('distGrid');
  grid.innerHTML = '';
  SECTIONS.forEach(sec => {
    const total = sectionTotal(sec.id);
    const pct = gt > 0 ? (total / gt * 100) : 0;
    const row = document.createElement('div');
    row.className = 'dist-row';
    row.innerHTML = `
      <div class="dist-label">${sec.label.split(' ')[0]}</div>
      <div class="dist-bar-wrap">
        <div class="dist-bar-fill" style="width:${pct.toFixed(1)}%;background:${sec.color}"></div>
      </div>
      <div class="dist-pct">${pct.toFixed(1)}%</div>
    `;
    grid.appendChild(row);
  });
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────
function goPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'charts') renderCharts();
}

// ─── INIT ────────────────────────────────────────────────────────────────
function init() {
  const now = new Date();
  const dateStr = now.toLocaleDateString('es-ES', { day:'2-digit', month:'short', year:'numeric' }).toUpperCase();
  document.getElementById('hDate').textContent = dateStr;
  document.getElementById('hDate2').textContent = dateStr;
  renderHome();
  saveHistory();
}

init();
